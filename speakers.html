<script>
    // Get the container element
    const container = document.getElementById('container-speaker');

    const row_card = document.createElement('div')
    row_card.className = 'row speakers'
    
    const row_card2 = document.createElement('div')
    row_card2.className = 'row speakers'

    function add_keynote(first_name, speaker) {
        const keynote_row = document.createElement('div')
        keynote_row.className = 'row speakers mb-4'

        keynote_row.innerHTML = `
             <div class="col-md-1">
                </div>
             <div class="col-md-10">
                 <div class="card border-warning" style="background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%); box-shadow: 0 6px 25px rgba(255,193,7,0.3); border: 2px solid #ffc107; border-radius: 15px;">
                   <div class="card-body text-center p-3">
                     <a href="#" data-toggle="modal" data-target="#speakerModal${first_name}" style="text-decoration: none; color: inherit;">
                       <span class="badge badge-warning mb-3" style="font-size: 16px; padding: 10px 20px; font-weight: 600;">🎤 KEYNOTE SPEAKER</span>
                       <h3 class="card-title text-dark mb-2" style="font-weight: 700; font-size: 22px; line-height: 1.2;">${speaker.title}</h3>
                       <h5 class="card-subtitle text-primary mb-2" style="font-weight: 500; font-size: 18px;">${speaker.name}</h5>
                       <p class="card-text text-muted mb-0" style="font-size: 16px; font-style: italic;">Click to discover more about this keynote</p>
                     </a>
                   </div>
                 </div>
             </div>
             <div class="col-md-1">
                </div>
        `

        return keynote_row
    }

    for(i = 0; i < modalData.length; i++) {
        // if(i == 6) {
        //     container.appendChild(row_card)
        // }
        speaker = modalData[i]
        var first_name = speaker.name.split(' ')[0]
        if(speaker.is_keynote) {
            keynote_row = add_keynote(first_name, speaker)
            container.appendChild(keynote_row)
            continue
        }
        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4';
        card.style = 'padding-top: 2em'
        
        // Alternate background colors for better visual separation
        const isEven = i % 2 === 0;

        card.innerHTML = `
                <div class="card h-100" style="background: ${isEven ? 'linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%)' : 'linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%)'}; box-shadow: 0 3px 12px rgba(0,0,0,0.08); border: none; border-radius: 12px; transition: all 0.3s ease; min-height: 180px;" onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='0 6px 20px rgba(0,0,0,0.12)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 3px 12px rgba(0,0,0,0.08)'">
                  <div class="card-body d-flex flex-column p-3" style="padding: 18px !important;">
                    <a href="#" data-toggle="modal" data-target="#speakerModal${first_name}" style="text-decoration: none; color: inherit; flex: 1; display: flex; flex-direction: column;">
                      <h4 class="card-title text-dark mb-2" style="font-weight: 600; font-size: 18px; line-height: 1.3; flex-grow: 1;">${speaker.title}</h4>
                      <div class="mt-auto">
                        <p class="card-subtitle text-primary mb-1" style="font-weight: 600; font-size: 18px; margin-bottom: 4px;">${speaker.name}</p>
                        <small class="text-muted" style="font-size: 13px; font-style: italic; margin-top: 2px;">Click to learn more</small>
                      </div>
                    </a>
                  </div>
                </div>
        `;

        // if(i <= 6) {
            row_card.appendChild(card);
        // }
        // else {
        //     row_card2.appendChild(card)
        // }
    }

    container.appendChild(row_card)
</script>
